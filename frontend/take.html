<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Phòng thi trực tuyến - TOEIC Reading App</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 4.6 & FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Figma Mobile Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="mobile-frame">
    <!-- Dynamic Island / iPhone Notch -->
    <div class="device-notch"></div>
    
    <!-- Status Bar (9:41 AM) -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-bar-icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <!-- Exam Sticky Header -->
    <div class="app-header">
      <a href="index.html" class="text-dark" onclick="return confirm('Bạn có chắc muốn thoát phòng thi? Tiến trình bài làm vẫn được lưu tạm.');">
        <i class="fas fa-arrow-left fa-lg"></i>
      </a>
      <div class="text-center">
        <div class="font-weight-bold" style="font-size: 0.85rem;">ETS Reading Test 07</div>
        <div class="small text-muted" id="examProgressText">0/100 câu</div>
      </div>
      <div class="timer-badge" id="timerBadge">
        <i class="far fa-clock"></i>
        <span id="timerText">75:00</span>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress" style="height: 4px; border-radius: 0; background: #e2e8f0;">
      <div class="progress-bar bg-primary" id="examProgressBar" role="progressbar" style="width: 0%; background-color: var(--primary) !important;"></div>
    </div>

    <!-- Scrollable Question Content Area -->
    <div class="app-content" id="questionsContainer">
      <!-- Generated dynamically by app.js from data.js -->
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 text-muted small font-weight-bold">Đang tải đề thi 100 câu hỏi...</div>
      </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="p-3 bg-white border-top d-flex align-items-center justify-content-between" style="flex-shrink: 0; z-index: 900;">
      <button type="button" class="btn btn-light font-weight-bold rounded-pill px-3 py-2 shadow-sm" data-toggle="modal" data-target="#paletteModal">
        <i class="fas fa-th mr-1 text-primary"></i> 100 câu
      </button>

      <button type="button" class="btn btn-primary-m px-4 py-2 font-weight-bold rounded-pill shadow-sm" id="btnOpenSubmitModal">
        <i class="fas fa-paper-plane mr-1"></i> Nộp bài
      </button>
    </div>
  </div>

  <!-- Modal Question Palette (Lưới 100 câu hỏi) -->
  <div class="modal fade" id="paletteModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document" style="max-width: 380px;">
      <div class="modal-content" style="border-radius: 24px; border: none;">
        <div class="modal-header border-0 pb-0">
          <div>
            <h5 class="modal-title font-weight-bold">Bảng câu hỏi</h5>
            <small class="text-muted">Nhấn vào số câu để chuyển nhanh đến câu đó</small>
          </div>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body pt-2">
          <div class="d-flex align-items-center justify-content-around small font-weight-bold mb-2 pb-2 border-bottom">
            <span class="d-flex align-items-center"><span class="badge badge-primary mr-1" style="background: var(--primary);">&nbsp;&nbsp;</span> Đã làm</span>
            <span class="d-flex align-items-center"><span class="badge badge-light border mr-1">&nbsp;&nbsp;</span> Chưa làm</span>
          </div>
          <div class="palette-grid" id="paletteGrid">
            <!-- Render 100 buttons -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Confirm Submit (Xác thực trước khi nộp) -->
  <div class="modal fade" id="confirmSubmitModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document" style="max-width: 360px;">
      <div class="modal-content" style="border-radius: 24px; border: none;">
        <div class="modal-body text-center p-4">
          <div class="rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 64px; height: 64px; background: #e0e7ff; color: var(--primary); font-size: 1.8rem;">
            <i class="fas fa-question-circle"></i>
          </div>
          <h5 class="font-weight-bold text-dark mb-2">Xác nhận nộp bài?</h5>
          <p class="small text-muted mb-3">Vui lòng kiểm tra lại số lượng câu hỏi trước khi nộp bài:</p>

          <div class="card bg-light border-0 p-3 mb-3" style="border-radius: 16px;">
            <div class="d-flex justify-content-between mb-2">
              <span class="small font-weight-bold text-muted">Số câu đã làm:</span>
              <span class="small font-weight-bold text-success" id="modalAnsweredCount">0</span>
            </div>
            <div class="d-flex justify-content-between">
              <span class="small font-weight-bold text-muted">Số câu chưa làm:</span>
              <span class="small font-weight-bold text-danger" id="modalRemainingCount">100</span>
            </div>
          </div>

          <div class="d-flex gap-2" style="gap: 10px;">
            <button type="button" class="btn btn-light btn-block font-weight-bold rounded-pill m-0" data-dismiss="modal">
              Làm tiếp
            </button>
            <button type="button" class="btn btn-primary-m btn-block font-weight-bold rounded-pill m-0" id="btnConfirmSubmit">
              Nộp ngay
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- TOEIC Data & App Engine -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.app.initTakeRoom();
    });
  </script>
</body>
</html>
